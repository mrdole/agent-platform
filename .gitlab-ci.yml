stages: [check, build, eval]

variables:
  AP_PYTHON_IMAGE: registry.access.redhat.com/ubi9/python-311:latest
  AP_BUILDAH_IMAGE: quay.io/buildah/stable:latest
  AP_IMAGE: registry.example.internal/tools/agent-platform:v0.1.0

default:
  tags: [agent]

check:
  stage: check
  image: ${AP_PYTHON_IMAGE}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - python3 -m pip install -q ${PIP_INDEX_URL:+--index-url "$PIP_INDEX_URL"} -r mcp/requirements.txt pytest pyvisa-sim
    - python3 tools/check.py
    - python3 -m pytest -q tests

build-image:
  stage: build
  image: ${AP_BUILDAH_IMAGE}
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
  script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - >-
      buildah build -f core/Containerfile
      --build-arg OPENCODE_ARCHIVE_URL --build-arg GLAB_RPM_URL --build-arg PIP_INDEX_URL
      -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" .
    - buildah push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"

evals:
  stage: eval
  image: ${AP_IMAGE}
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $AP_EVALS == "1"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  variables:
    AP_HOME: $CI_PROJECT_DIR
    AP_VENV: /opt/agent-platform/venv
    AP_KNOWLEDGE_ROOT: /srv/lab-knowledge
  script:
    - python3 evals/run.py --baseline evals/baseline.json --out .eval-results
  artifacts:
    when: always
    paths: [.eval-results/]
    expire_in: 30 days
