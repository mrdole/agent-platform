- name: Tool directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ap_tools_dir }}"
    - "{{ ap_bin_dir }}"
  become: "{{ ap_become }}"

- name: Check the OpenCode install settings
  ansible.builtin.assert:
    that:
      - opencode_install in ['npm', 'archive', 'none']
      - not (opencode_install == 'npm' and (opencode_version | string).split('.')[0] | int >= 2)
      - not (opencode_install == 'archive' and (opencode_archive_url | default('') | length) == 0)
    fail_msg: >-
      Bad OpenCode settings (opencode_install={{ opencode_install }}, opencode_version={{ opencode_version }}).
      opencode_install must be npm, archive or none. npm cannot install OpenCode 2.x (the opencode-ai
      package has no 2.x release): use archive with opencode_archive_url set to a tar.gz on your
      internal mirror that holds the `opencode` executable, or none and install it yourself.
      archive needs opencode_archive_url to be non-empty.
    quiet: true

- name: Installed OpenCode version
  ansible.builtin.command: "{{ ap_bin_dir }}/opencode --version"
  register: tools_opencode_version
  changed_when: false
  failed_when: false

# ---- npm (1.x only): Node.js from RHEL AppStream + the opencode-ai package ----
- name: Install OpenCode with npm
  when: opencode_install == "npm"
  block:
    - name: Install Node.js from AppStream, stream {{ nodejs_stream }}
      ansible.builtin.dnf:
        name: "@nodejs:{{ nodejs_stream }}/common"
        state: present
      become: true

    - name: Install opencode-ai {{ opencode_version }}
      ansible.builtin.command:
        argv: "{{ ['npm', 'install', '--global', '--prefix', ap_npm_prefix, 'opencode-ai@' + opencode_version]
                  + (['--registry', npm_registry] if npm_registry else []) }}"
      environment:
        NODE_EXTRA_CA_CERTS: /etc/pki/tls/certs/ca-bundle.crt
        HTTPS_PROXY: "{{ ap_https_proxy }}"
        NO_PROXY: "{{ ap_no_proxy }}"
      become: "{{ ap_become }}"
      when: (tools_opencode_version.stdout | default('') | trim) != opencode_version
      changed_when: true

# ---- archive (default): a tar.gz with the `opencode` executable at its top level (internal mirror) ----
- name: Install OpenCode from archive
  when: opencode_install == "archive"
  become: "{{ ap_become }}"
  block:
    - name: OpenCode version directory
      ansible.builtin.file:
        path: "{{ ap_tools_dir }}/opencode-{{ opencode_version }}"
        state: directory
        mode: "0755"

    - name: Unpack OpenCode
      ansible.builtin.unarchive:
        src: "{{ opencode_archive_url }}"
        dest: "{{ ap_tools_dir }}/opencode-{{ opencode_version }}"
        remote_src: true
        creates: "{{ ap_tools_dir }}/opencode-{{ opencode_version }}/opencode"

    - name: Link opencode into PATH
      ansible.builtin.file:
        src: "{{ ap_tools_dir }}/opencode-{{ opencode_version }}/opencode"
        dest: "{{ ap_bin_dir }}/opencode"
        state: link
        force: true

- name: Check that opencode is on PATH
  ansible.builtin.shell: command -v opencode  # noqa: command-instead-of-shell (builtin)
  environment:
    PATH: "{{ ap_bin_dir }}:{{ ansible_facts['env']['PATH'] }}"
  register: tools_opencode_check
  changed_when: false
  failed_when: tools_opencode_check.rc != 0 and opencode_install != "none"

- name: Warn when opencode is missing
  ansible.builtin.debug:
    msg: "opencode not found and opencode_install is 'none'. Install it yourself, or set opencode_install: archive with opencode_archive_url."
  when: tools_opencode_check.rc != 0

- name: Install glab from RPM (optional)
  ansible.builtin.dnf:
    name: "{{ glab_rpm_url }}"
    state: present
    disable_gpg_check: "{{ glab_rpm_disable_gpg_check }}"
  become: true
  when: glab_rpm_url | length > 0
